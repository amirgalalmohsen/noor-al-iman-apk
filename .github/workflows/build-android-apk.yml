name: Build Noor Al-Iman APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Noor-Al-Iman-Android-Source.zip'
      - 'Noor-Al-Iman-Full-Project.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          if [ -f 'Noor-Al-Iman-Full-Project.zip' ]; then
            ZIP_FILE='Noor-Al-Iman-Full-Project.zip'
          elif [ -f 'Noor-Al-Iman-Android-Source.zip' ]; then
            ZIP_FILE='Noor-Al-Iman-Android-Source.zip'
          else
            echo 'ERROR: Android project ZIP not found in repository root.'
            ls -la
            exit 1
          fi
          echo "Using source archive: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo 'ERROR: Gradle wrapper (gradlew) not found in the ZIP.'
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and print Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo 'ERROR: No debug APK was generated.'
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo 'ERROR: Android build tools were not found.'
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-details.txt" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' || true
          cp "$APK" "$GITHUB_WORKSPACE/Noor-Al-Iman.apk"
          echo "APK size: $(du -h "$GITHUB_WORKSPACE/Noor-Al-Iman.apk" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Iman-APK
          path: |
            Noor-Al-Iman.apk
            apk-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noor-al-iman-${{ github.run_number }}
          name: Noor Al-Iman APK ${{ github.run_number }}
          body: |
            Android APK built by GitHub Actions. APK signature is verified during the build.
            If a previous copy of this app is installed, uninstall that copy first because debug APK signatures can differ between builds.
          files: Noor-Al-Iman.apk
          make_latest: true
