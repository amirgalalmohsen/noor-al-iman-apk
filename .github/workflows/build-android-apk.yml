name: Build Noor Al-Iman APK

on:
  push:
    paths:
      - 'Noor-Al-Iman-Full-Project (2).zip'
      - 'Noor-Al-Iman-Full-Project*.zip'
      - 'Noor-Al-Iman-Android-Source.zip'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoid automatic package installation here; the next step installs only supported SDK packages.
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract the newest full project ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source

          if [[ -f "Noor-Al-Iman-Full-Project (2).zip" ]]; then
            ZIP_FILE="Noor-Al-Iman-Full-Project (2).zip"
          elif [[ -f "Noor-Al-Iman-Full-Project.zip" ]]; then
            ZIP_FILE="Noor-Al-Iman-Full-Project.zip"
          elif [[ -f "Noor-Al-Iman-Android-Source.zip" ]]; then
            ZIP_FILE="Noor-Al-Iman-Android-Source.zip"
          else
            echo "::error::No project ZIP was found in the repository."
            ls -lah
            exit 1
          fi

          echo "Using project archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          GRADLEW="$(find "$GITHUB_WORKSPACE/source" -type f -name gradlew -print -quit)"
          if [[ -z "$GRADLEW" ]]; then
            echo "::error::The selected ZIP does not contain a Gradle wrapper (gradlew)."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" && ! -f "$PROJECT_DIR/settings.gradle" ]]; then
            echo "::error::Gradle project settings were not found beside gradlew."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected Android project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug \
            -PappVersion="1.0.${GITHUB_RUN_NUMBER}"

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "::error::Gradle finished but no debug APK was found."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/Noor-Al-Iman.apk"
          echo "APK_FILE=$GITHUB_WORKSPACE/dist/Noor-Al-Iman.apk" >> "$GITHUB_ENV"

      - name: Verify APK is a real installable package
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/Noor-Al-Iman.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK is missing or empty."
            exit 1
          fi

          SIZE_BYTES="$(stat -c '%s' "$APK")"
          echo "APK size: $SIZE_BYTES bytes"
          ls -lh "$APK"

          if (( SIZE_BYTES < 1048576 )); then
            echo "::error::The APK is smaller than 1 MiB; refusing to publish a suspicious output."
            exit 1
          fi

          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "::error::Android aapt tool was not found."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.amirgalal.nooreleman'" || {
            echo "::error::The APK package name is not com.amirgalal.nooreleman."
            echo "$BADGING" | head -20
            exit 1
          }
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Iman-APK-${{ github.run_number }}
          path: dist/Noor-Al-Iman.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noor-al-iman-build-${{ github.run_number }}
          name: Noor Al-Iman APK build ${{ github.run_number }}
          body: |
            تم بناء ملف APK لتطبيق نور الإيمان والتحقق من سلامة الحزمة واسم التطبيق.

            اسم الحزمة: `com.amirgalal.nooreleman`
            نوع النسخة: Debug APK قابل للاختبار.

            ملاحظة: يجب اختبار وظائف التطبيق والتنبيهات على الهاتف قبل اعتبار النسخة جاهزة للإنتاج.
          files: dist/Noor-Al-Iman.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
